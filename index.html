<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Magik Trainer</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4CAF50">


<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f5f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.app{
  width:320px;
  background:white;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  padding:20px;
}

button{
  margin-top:16px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:12px;
  font-size:16px;
  background:#4CAF50;
  color:white;
  cursor:pointer;
}

button.secondary{
  background:#e9eef7;
  color:#111;
}

button.danger{
  background:#ffebee;
  color:#111;
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.row button{
  width:auto;
  flex:1;
  margin-top:0;
  padding:10px;
  font-size:13px;
}

input, select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ddd;
}

.hidden{ display:none; }

.list{
  margin-top:16px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.item{
  background:#f7f9ff;
  border:1px solid #e8ecff;
  border-radius:12px;
  padding:10px;
  margin-top:10px;
}

.meta{
  font-size:12px;
  opacity:0.75;
  margin-top:4px;
}
</style>
</head>

<body>
<div class="app">
  <h2>Magik Trainer</h2>

  <button onclick="showForm()">+ Dodaj trening</button>

  <div id="form" class="hidden">
    <select id="type">
      <option>Flyball</option>
      <option>Posłuszeństwo</option>
      <option>Nosework</option>
      <option>Spacer treningowy</option>
      <option>Regulacja / wyciszenie</option>
    </select>

    <input id="minutes" type="number" min="0" placeholder="Czas (minuty)">
    <input id="note" placeholder="Notatka (opcjonalnie)">

    <button onclick="saveTraining()">Zapisz trening</button>
    <button class="secondary" onclick="hideForm()">Anuluj</button>
  </div>

  <div class="list">
    <strong>Ostatnie treningi</strong>
    <div id="items"></div>
  </div>
</div>

<script>
const STORAGE_KEY = "magik_trainings_v1";
const itemsEl = document.getElementById("items");

function showForm(){
  document.getElementById("form").classList.remove("hidden");
}

function hideForm(){
  document.getElementById("form").classList.add("hidden");
}

function loadTrainings(){
  let list = [];
  try{
    list = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }catch{
    list = [];
  }

  // MIGRACJA: dopisz id do starych wpisów, które go nie mają
  let changed = false;
  list = list.map(t => {
    if(!t.id){
      changed = true;
      return {
        ...t,
        id: (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + "_" + Math.random()
      };
    }
    return t;
  });

  if(changed) saveTrainings(list);
  return list;
}


function saveTrainings(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function render(){
  const list = loadTrainings();

  if(list.length === 0){
    itemsEl.innerHTML = "<p class='meta'>Brak wpisów. Dodaj pierwszy trening 🙂</p>";
    return;
  }

  itemsEl.innerHTML = list
    .slice().reverse()
    .map(t => `
      <div class="item">
        <div><strong>${escapeHtml(t.type)}</strong> • ${t.minutes} min</div>
        ${t.note ? `<div class="meta">${escapeHtml(t.note)}</div>` : ""}
        <div class="meta">${new Date(t.createdAt).toLocaleString()}</div>

        <div class="row">
          <button class="danger" data-action="delete" data-id="${escapeHtml(t.id)}">Usuń</button>
        </div>
      </div>
    `).join("");
}

function saveTraining(){
  const type = document.getElementById("type").value;
  const minutes = Number(document.getElementById("minutes").value || 0);
  const note = document.getElementById("note").value.trim();

  if(minutes <= 0){
    alert("Podaj czas w minutach (większy niż 0).");
    return;
  }

  const list = loadTrainings();
  list.push({
    id: (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + "_" + Math.random(),
    type,
    minutes,
    note,
    createdAt: Date.now()
  });
  saveTrainings(list);

  document.getElementById("minutes").value = "";
  document.getElementById("note").value = "";
  hideForm();

  render();
}

itemsEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if(!btn) return;

  if(btn.dataset.action === "delete"){
    const id = btn.dataset.id;
    if(!confirm("Usunąć ten wpis?")) return;

    const list = loadTrainings().filter(x => x.id !== id);
    saveTrainings(list);
    render();
  }
});

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

render();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js", { scope: "./" });
}
</script>

</body>
</html>
