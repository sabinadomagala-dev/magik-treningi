<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Magik Trainer</title>

  <style>
    body{
      margin:0;
      font-family: system-ui;
      background:#f5f7fb;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .app{
      width:320px;
      background:white;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.15);
      padding:20px;
      text-align:center;
    }

    button{
      margin-top:20px;
      padding:15px;
      width:100%;
      border:none;
      border-radius:12px;
      font-size:18px;
      background:#4CAF50;
      color:white;
      cursor:pointer;
    }

    button:hover{
      background:#43a047;
    }
  </style>

</head>
<body>

<div class="app">
  <h2>Magik Trainer</h2>
  <p>Tracker treningów</p>

  <button>+ Dodaj trening</button>
</div>

</body>
</html>
