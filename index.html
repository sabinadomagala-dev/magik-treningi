<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Magik Trainer</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f5f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.app{
  width:320px;
  background:white;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  padding:20px;
}

button{
  margin-top:12px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:12px;
  font-size:15px;
  background:#4CAF50;
  color:white;
  cursor:pointer;
}

button.secondary{
  background:#e9eef7;
  color:#111;
}

button.danger{
  background:#ffebee;
  color:#111;
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.row button{
  width:auto;
  flex:1;
  margin-top:0;
  padding:10px;
  font-size:13px;
}

input, select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ddd;
}

.hidden{ display:none; }

.list{
  margin-top:16px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.item{
  background:#f7f9ff;
  border:1px solid #e8ecff;
  border-radius:12px;
  padding:10px;
  margin-top:10px;
}

.meta{
  font-size:12px;
  opacity:0.75;
  margin-top:4px;
}
</style>
</head>

<body>
<div class="app">
  <h2>Magik Trainer</h2>

  <button onclick="startAdd()">+ Dodaj trening</button>

  <div id="form" class="hidden">
    <div class="meta" id="formTitle">Dodaj trening</div>

    <select id="type">
      <option>Flyball</option>
      <option>Posłuszeństwo</option>
      <option>Nosework</option>
      <option>Spacer treningowy</option>
      <option>Regulacja / wyciszenie</option>
    </select>

    <input id="minutes" type="number" min="0" placeholder="Czas (minuty)">
    <input id="note" placeholder="Notatka (opcjonalnie)">

    <button id="saveBtn" onclick="save()">Zapisz</button>

    <div class="row">
      <button class="secondary" onclick="cancel()">Anuluj</button>
      <button class="danger hidden" id="deleteBtn" onclick="deleteCurrent()">Usuń</button>
    </div>
  </div>

  <div class="list">
    <strong>Ostatnie treningi</strong>
    <div id="items"></div>
  </div>
</div>

<script>
const STORAGE_KEY = "magik_trainings_v1";
let mode = "add";        // "add" | "edit"
let editingId = null;    // id wpisu edytowanego

const itemsEl = document.getElementById("items");

function showForm(){ document.getElementById("form").classList.remove("hidden"); }
function hideForm(){ document.getElementById("form").classList.add("hidden"); }

function loadTrainings(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch{ return []; }
}
function saveTrainings(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function startAdd(){
  mode = "add";
  editingId = null;

  document.getElementById("formTitle").textContent = "Dodaj trening";
  document.getElementById("saveBtn").textContent = "Zapisz trening";
  document.getElementById("deleteBtn").classList.add("hidden");

  document.getElementById("type").value = "Flyball";
  document.getElementById("minutes").value = "";
  document.getElementById("note").value = "";

  showForm();
}

function startEdit(id){
  const list = loadTrainings();
  const t = list.find(x => x.id === id);
  if(!t) return;

  mode = "edit";
  editingId = id;

  document.getElementById("formTitle").textContent = "Edytuj trening";
  document.getElementById("saveBtn").textContent = "Zapisz zmiany";
  document.getElementById("deleteBtn").classList.remove("hidden");

  document.getElementById("type").value = t.type;
  document.getElementById("minutes").value = t.minutes;
  document.getElementById("note").value = t.note || "";

  showForm();
}

function cancel(){
  hideForm();
  mode = "add";
  editingId = null;
}

function save(){
  const type = document.getElementById("type").value;
  const minutes = Number(document.getElementById("minutes").value || 0);
  const note = document.getElementById("note").value.trim();

  if(minutes <= 0){
    alert("Podaj czas w minutach (większy niż 0).");
    return;
  }

  const list = loadTrainings();

  if(mode === "add"){
    list.push({
      id: (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + "_" + Math.random(),
      type,
      minutes,
      note,
      createdAt: Date.now(),
      updatedAt: Date.now()
    });
  }else{
    const idx = list.findIndex(x => x.id === editingId);
    if(idx === -1){
      alert("Nie mogę znaleźć wpisu do edycji.");
      return;
    }
    list[idx] = { ...list[idx], type, minutes, note, updatedAt: Date.now() };
  }

  saveTrainings(list);
  hideForm();
  mode = "add";
  editingId = null;
  render();
}

function deleteCurrent(){
  if(!editingId) return;
  if(!confirm("Usunąć ten wpis?")) return;

  const list = loadTrainings().filter(x => x.id !== editingId);
  saveTrainings(list);

  hideForm();
  mode = "add";
  editingId = null;
  render();
}

function quickDelete(id){
  if(!confirm("Usunąć ten wpis?")) return;
  const list = loadTrainings().filter(x => x.id !== id);
  saveTrainings(list);
  render();
}

function render(){
  const list = loadTrainings();

  if(list.length === 0){
    itemsEl.innerHTML = "<p class='meta'>Brak wpisów. Dodaj pierwszy trening 🙂</p>";
    return;
  }

  itemsEl.innerHTML = list
    .slice().reverse()
    .map(t => `
      <div class="item">
        <div><strong>${escapeHtml(t.type)}</strong> • ${t.minutes} min</div>
        ${t.note ? `<div class="meta">${escapeHtml(t.note)}</div>` : ""}
        <div class="meta">
          ${new Date(t.createdAt).toLocaleString()}
          ${t.updatedAt && t.updatedAt !== t.createdAt ? " • edytowane" : ""}
        </div>
        <div class="row">
          <button class="secondary" data-action="edit" data-id="${escapeHtml(t.id)}">Edytuj</button>
          <button class="danger" data-action="delete" data-id="${escapeHtml(t.id)}">Usuń</button>
        </div>
      </div>
    `).join("");
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* --- podpinamy kliknięcia raz, na kontenerze listy --- */
itemsEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if(!btn) return;

  const action = btn.dataset.action;
  const id = btn.dataset.id;

  if(action === "edit") startEdit(id);
  if(action === "delete") quickDelete(id);
});

/* --- wystawiamy funkcje dla przycisków z HTML --- */
window.startAdd = startAdd;
window.cancel = cancel;
window.save = save;
window.deleteCurrent = deleteCurrent;

/* start */
render();
</script>

</body>
</html>
